services:
  md2html:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: md2html
    ports:
      - "8777:8777"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8777/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - PYTHONUNBUFFERED=1
