name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"                 # auto-caches pip downloads
      - run: pip install -r requirements.txt
      - run: pip install requests
      - name: Run tests
        env:
          MD2HTML_BASE_URL: ${{ vars.MD2HTML_BASE_URL || 'http://147.15.103.217/md2html/' }}
        run: python -m pytest test_suite.py -v
