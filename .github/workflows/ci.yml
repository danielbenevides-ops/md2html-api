name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"                 # auto-caches pip downloads
      - run: pip install -r requirements.txt
      - run: pip install requests
      - name: Run tests
        env:
          MD2HTML_BASE_URL: ${{ vars.MD2HTML_BASE_URL || 'https://147.15.103.217.sslip.io/md2html/' }}
        run: python -m unittest discover -v
      - name: Validate Node SDK syntax
        run: node --check sdk/md2html-client.js
